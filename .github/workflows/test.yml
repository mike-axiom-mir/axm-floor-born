name: floorborn-proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run proof tests
        run: npm test
      - name: Run first proof demo
        run: npm run demo
      - name: Run expedition player gate
        run: npm run expedition
      - name: Run continuity player gate
        run: npm run continuity
      - name: Run evidence revision gate
        run: npm run revision
      - name: Run intention lifecycle gate
        run: npm run intention
